<!doctype html>
<!--
  Source of docs/images/social-preview.png (1280x640), also used by the landing page (Penrill/penrill-site).
  Rendered by `npm run icons`, which fills in the {{palette}} colours and a <base> at the repo root.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    background: {{page}};
    background-image: radial-gradient({{dot}} 1.6px, transparent 1.8px);
    background-size: 28px 28px;
    background-position: 14px 14px;
    font-family: -apple-system, "Segoe UI", sans-serif;
    color: {{text}};
  }
  .brand { position: absolute; left: 48px; top: 178px; display: flex; align-items: center; gap: 22px; }
  .brand img { width: 100px; height: 100px; margin: -12px; }
  .brand h1 { margin: 0; font-size: 77px; font-weight: 800; letter-spacing: -0.035em; }
  .lead { position: absolute; left: 48px; top: 305px; margin: 0; font-size: 29px; line-height: 1.3; font-weight: 500; color: {{muted}}; }
  .platforms { position: absolute; left: 48px; top: 427px; margin: 0; font-size: 22px; font-weight: 600; }
  .shot {
    position: absolute; left: 478px; top: 80px; width: 768px; height: 480px;
    border-radius: 18px; overflow: hidden; background: #fff;
    border: 1px solid {{edge}};
    box-shadow: 0 2px 6px rgba(9, 11, 12, 0.05), 0 24px 60px rgba(9, 11, 12, 0.12);
  }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
</style>
</head>
<body>
  <div class="brand"><img src="build/icon.svg" alt=""><h1>Penrill</h1></div>
  <p class="lead">Free infinite whiteboard<br>for your pen tablet</p>
  <p class="platforms">Windows · macOS · Linux · Web</p>
  <div class="shot"><img src="scripts/icons/hero-en.webp" alt=""></div>
</body>
</html>
