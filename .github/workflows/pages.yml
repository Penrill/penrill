# Publishes the web app (the same app as the desktop one, boards kept in the browser) to GitHub Pages
# at https://app.penrill.com/. The landing page at penrill.com lives in Penrill/penrill-site.
name: Pages

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'src/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build:web
        env:
          # Repository variable; when empty the app offers only device and self-hosted storage.
          VITE_PENRILL_CLOUD_URL: ${{ vars.PENRILL_CLOUD_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web
      - id: deployment
        uses: actions/deploy-pages@v5
